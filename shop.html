<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — HEROFORGE</title>
  <meta name="theme-color" content="#060607">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">
  <main>
    <section class="page-top">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span id="crumb">Shop</span></nav>
        <h1 class="display" id="shopTitle">Shop</h1>
        <p id="shopDesc">Every hero, every style — filter by character, size, colour, price and more.</p>
        <div class="sc-chips" id="scopeChips" style="margin-top:18px"></div>
      </div>
    </section>

    <div class="container shop">
      <aside class="filters" id="filters" aria-label="Filters"></aside>
      <div class="filters-ov" id="filtersOv"></div>
      <section>
        <div id="charBanner"></div>
        <div class="toolbar">
          <div class="left">
            <button class="btn btn-ghost filter-toggle" id="filterToggle" type="button">Filters</button>
            <span class="count" id="count" role="status"></span>
          </div>
          <div class="left">
            <label class="searchbar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="shopSearch" type="search" placeholder="Search this section" aria-label="Search products" autocomplete="off"></label>
            <select class="sort" id="sort" aria-label="Sort products">
              <option value="default">Featured</option>
              <option value="newest">Newest</option>
              <option value="popular">Popular</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
            </select>
          </div>
        </div>
        <div class="active-chips" id="activeChips"></div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden><h3>No heroes found</h3><p>Try removing a filter or searching for something else.</p><br><button class="btn btn-red" id="emptyClear" type="button">Clear all filters</button></div>
        <div class="more" id="moreWrap" hidden><button class="btn btn-ghost" id="more" type="button">Load more</button></div>
      </section>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script src="js/art.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
